spring:
  application:
    name: payment-gateway-sandbox
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_gateway}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
payment:
  provider: ${PAYMENT_PROVIDER:fake}   # fake | stripe
  fake:
    latency-ms-min: ${FAKE_LATENCY_MS_MIN:0}
    latency-ms-max: ${FAKE_LATENCY_MS_MAX:0}
    failure-rate: ${FAKE_FAILURE_RATE:0}
  stripe:
    api-key: ${STRIPE_API_KEY:}
    payment-method: ${STRIPE_TEST_PAYMENT_METHOD:}   # ex.: pm_card_visa -> confirma e captura na criacao
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
    max-network-retries: 2
