spring:
  application:
    name: payment-gateway-sandbox
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_gateway}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
payment:
  provider: ${PAYMENT_PROVIDER:fake}   # fake | stripe (stripe ainda nao implementado)
  fake:
    latency-ms-min: ${FAKE_LATENCY_MS_MIN:0}
    latency-ms-max: ${FAKE_LATENCY_MS_MAX:0}
    failure-rate: ${FAKE_FAILURE_RATE:0}
